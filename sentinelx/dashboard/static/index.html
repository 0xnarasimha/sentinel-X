<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sentinel-X — Network Protection Dashboard</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --green-bg: rgba(22, 163, 74, 0.16);
      --green-border: #16a34a;
      --green-text: #4ade80;
      --red-bg: rgba(220, 38, 38, 0.18);
      --red-border: #dc2626;
      --red-text: #f87171;
      --amber-bg: rgba(217, 119, 6, 0.18);
      --amber-border: #d97706;
      --amber-text: #fbbf24;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 24px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }
    .brand {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .badge {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }
    .badge.ok {
      background: var(--green-bg);
      border-color: var(--green-border);
      color: var(--green-text);
    }
    .badge.tampered {
      background: var(--red-bg);
      border-color: var(--red-border);
      color: var(--red-text);
    }
    .banner {
      padding: 20px 24px;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-bottom: 24px;
      font-size: 1.15rem;
      font-weight: 600;
    }
    .banner.ok {
      background: var(--green-bg);
      border-color: var(--green-border);
      color: var(--green-text);
    }
    .banner.danger {
      background: var(--red-bg);
      border-color: var(--red-border);
      color: var(--red-text);
    }
    .banner.warning {
      background: var(--amber-bg);
      border-color: var(--amber-border);
      color: var(--amber-text);
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }
    .card-label {
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .card-value {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 1rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      word-break: break-all;
    }
    .feed-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
    }
    .feed-title {
      margin: 0 0 16px 0;
      font-size: 1rem;
      font-weight: 600;
    }
    .feed-item {
      padding: 12px 0;
      border-top: 1px solid var(--border);
    }
    .feed-item:first-child {
      border-top: none;
    }
    .feed-sentence {
      font-size: 0.95rem;
      margin-bottom: 4px;
    }
    details {
      font-size: 0.8rem;
      color: var(--muted);
    }
    details summary {
      cursor: pointer;
      user-select: none;
    }
    pre {
      background: #090d16;
      padding: 10px;
      border-radius: 6px;
      overflow-x: auto;
      color: #cbd5e1;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">Sentinel-X · Gateway ARP Protection</div>
      <div id="integrity-badge" class="badge">Checking log chain...</div>
    </header>

    <section id="status-banner" class="banner warning">
      Loading protection status...
    </section>

    <section class="cards">
      <div class="card">
        <div class="card-label">Pinned Gateway (IP / MAC / Mode)</div>
        <div id="card-gateway" class="card-value">—</div>
      </div>
      <div class="card">
        <div class="card-label">Total Incidents</div>
        <div id="card-incidents" class="card-value">0</div>
      </div>
      <div class="card">
        <div class="card-label">Last Incident</div>
        <div id="card-last-incident" class="card-value">None</div>
      </div>
      <div class="card">
        <div class="card-label">Dropped Events</div>
        <div id="card-dropped" class="card-value">0</div>
      </div>
    </section>

    <section class="feed-panel">
      <h2 class="feed-title">Incident &amp; Audit Feed (Hash-Chained Log)</h2>
      <div id="incident-feed">No log entries yet.</div>
    </section>
  </div>

  <script>
    async function refreshStatus() {
      try {
        const res = await fetch('/api/snapshot');
        if (!res.ok) return;
        const data = await res.json();
        const bannerEl = document.getElementById('status-banner');
        bannerEl.className = 'banner ' + (data.banner.level || 'warning');
        bannerEl.textContent = data.banner.headline;

        const st = data.status || {};
        document.getElementById('card-gateway').textContent =
          (st.gw_ip || '—') + ' · ' + (st.gw_mac || 'unpinned') + ' (' + (st.pin_mode || 'always') + ')';
        document.getElementById('card-incidents').textContent = String(st.incidents_total ?? 0);
        document.getElementById('card-last-incident').textContent =
          st.last_incident_ts ? new Date(st.last_incident_ts * 1000).toISOString().slice(11, 19) + ' UTC' : 'None';
        document.getElementById('card-dropped').textContent = String(st.dropped_events ?? 0);

        const badgeEl = document.getElementById('integrity-badge');
        badgeEl.className = 'badge ' + (data.integrity.ok ? 'ok' : 'tampered');
        badgeEl.textContent = data.integrity.badge;

        const feedEl = document.getElementById('incident-feed');
        const entries = (data.entries || []).slice().reverse();
        if (!entries.length) {
          feedEl.textContent = 'No log entries recorded.';
        } else {
          feedEl.innerHTML = entries.map(e => `
            <div class="feed-item">
              <div class="feed-sentence">${e.sentence}</div>
              <details>
                <summary>Details (entry #${e.idx} · ${e.type})</summary>
                <pre>${JSON.stringify(e, null, 2)}</pre>
              </details>
            </div>
          `).join('');
        }
      } catch (err) {
        console.error('Poll failed:', err);
      }
    }

    refreshStatus();
    setInterval(refreshStatus, 1000);
  </script>
</body>
</html>
