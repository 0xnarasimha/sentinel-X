[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelx"
version = "0.1.0"
description = "Lightweight Linux daemon protecting hosts from ARP-poisoning MITM with TOFU pinning, active router cache healing, and SHA-256 hash-chained logs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Team Aparajitha" }
]
dependencies = [
    "scapy>=2.5.0",
    "jinja2>=3.1.0",
    "httpx>=0.24.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "psutil>=5.9.0",
]

[project.scripts]
sentinelx = "sentinelx.cli:main"

[tool.setuptools.packages.find]
include = ["sentinelx*"]

[tool.setuptools.package-data]
sentinelx = ["templates/*.j2", "dashboard/static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: integration tests requiring root privileges and Linux network namespaces",
]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = ["node_modules", "dist", ".git", ".venv", "src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
